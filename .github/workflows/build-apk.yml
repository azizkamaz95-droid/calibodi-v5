name: 🔥 Build CaliBodi APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check files
        run: |
          echo "=== Fichiers du repo ==="
          ls -la
          echo ""
          echo "=== package.json ==="
          cat package.json
          echo ""
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json || echo "ABSENT"

      - name: Install npm
        run: npm install

      - name: Install Capacitor Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Gradle permissions
        run: chmod +x android/gradlew

      - name: Build
        run: cd android && ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || (cat build.log && exit 1)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calibodi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
