name: 🔥 Build CaliBodi APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          rm cmdtools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          sdkmanager --sdk_root=$HOME/android-sdk \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply CaliBodi theme
        run: |
          if [ -d "android-stubs" ]; then
            cp -r android-stubs/app/src/main/res/values/* android/app/src/main/res/values/ 2>/dev/null || true
          fi

      - name: Show project structure
        run: |
          echo "=== package.json ==="
          cat package.json
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json
          echo "=== android folder exists? ==="
          ls -la android/ 2>/dev/null || echo "No android folder"
          echo "=== android/app/build.gradle ==="
          cat android/app/build.gradle 2>/dev/null || echo "No build.gradle"

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK Debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          cd android
          echo "=== ANDROID_HOME: $ANDROID_HOME ==="
          echo "=== Java version ==="
          java -version
          echo "=== Gradle version ==="
          ./gradlew --version
          echo "=== Starting build ==="
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
          echo "=== Build exit code: $? ==="

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calibodi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "🔥 CaliBodi v${{ github.run_number }}"
          body: |
            ## 📱 CaliBodi APK

            ### Installation
            1. Télécharge app-debug.apk
            2. Android → Paramètres → Sécurité → Sources inconnues
            3. Ouvre l'APK → Installer
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
